ArgumentStyle.display=Argument Style
ArgumentStyle.help=Defines the style of command-line arguments for the shell default: dash -

AuthenticationScheme.display=Authentication Scheme
AuthenticationScheme.help=(ONLY password is supported) Specifies the scheme used for authentication is supported .

Host.display=Host
Host.help=The hostname or IP address of the target server for the shell connection.

