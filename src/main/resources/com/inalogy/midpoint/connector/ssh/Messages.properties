KnownHosts.help=(NOT Implemented) An array of known host identifiers, used for verifying the identity of the remote host during connection.

Passphrase.display=Passphrase
Passphrase.help=(NOT Implemented) The passphrase used for decrypting an encrypted private key, if applicable.

Password.display=Password
Password.help=The password used for authentication with the remote server.

Port.display=Port
Port.help=The port number on the remote host to which the connection will be made.

PrivateKey.display=Private Key
PrivateKey.help=(NOT Implemented) The private key used for public key authentication with the remote server.

SchemaFilePath.display=Schema File Path
SchemaFilePath.help=Absolute File path to the schemaConfig.json
DynamicConfigurationFilePath.display=Dynamic Configuration File Path
DynamicConfigurationFilePath.help=Absolute File path to the dynamicConfiguration.json
ShellType.display=Shell Type
ShellType.help=The type of shell to be used, such as 'bash', 'csh', 'ksh' or 'powershell'.

Username.display=Username
Username.help=The username used for authentication with the remote server.

