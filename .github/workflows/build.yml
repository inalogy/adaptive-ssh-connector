name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven

      # verify runs the enforcer rules, unit and integration tests, and packages the connector jar
      - name: Build and test
        run: mvn --batch-mode verify
