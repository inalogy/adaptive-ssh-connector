name: Generate SBOM

on:
  push:
    branches:
      - main
    paths:
      - 'pom.xml'
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate SBOM (CycloneDX)
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom \
            -DoutputFormat=all \
            -DoutputName=bom \
            --no-transfer-progress

      - name: Move SBOM files to root
        run: |
          cp target/bom.json ./bom.json
          cp target/bom.xml ./bom.xml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update SBOM"
          branch: chore/update-sbom
          base: main
          title: "chore: update SBOM"
          body: "Automatically generated SBOM files (bom.json, bom.xml) by GitHub Actions."
          labels: automated, sbom
          add-paths: |
            bom.json
            bom.xml
